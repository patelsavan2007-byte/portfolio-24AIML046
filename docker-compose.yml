# ==============================================================
# Practical 11: Containerization with Docker & Docker Compose
# Services: frontend (React/Nginx), backend (Node/Express), mongodb
# ==============================================================

services:
  # ------------------------------------------------------------
  # 1. Frontend Service (React SPA served on port 5173)
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  # ------------------------------------------------------------
  # 2. Backend Service (Node.js/Express API served on port 5000)
  # ------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: task-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=development
      - PORT=5000
      - CLIENT_ORIGIN=http://localhost:5173
      # Service name 'mongodb' resolves to the mongodb container via Docker internal DNS
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=your_super_secret_jwt_key_change_this_in_production
    restart: unless-stopped
    networks:
      - app-network

  # ------------------------------------------------------------
  # 3. MongoDB Service (Official Mongo image on port 27017)
  # ------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: task-mongodb
    ports:
      - "27017:27017"
    volumes:
      # Named volume ensures database persists across container restarts/rebuilds
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - app-network

# ==============================================================
# Named Volumes (Data Persistence)
# ==============================================================
volumes:
  mongo-data:
    name: task-mongo-data

# ==============================================================
# Custom Bridge Network (Inter-Container Communication)
# ==============================================================
networks:
  app-network:
    name: task-app-network
    driver: bridge
